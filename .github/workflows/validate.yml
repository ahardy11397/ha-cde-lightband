name: Validate

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  gate:
    # A validation run can sit queued for a long time; if its PR merges (and
    # the branch is deleted) before the run starts, hacs/action 404s on the
    # missing branch and fails spuriously. Check the PR's *live* state here —
    # the event payload's `state` is snapshotted at trigger time and stays
    # "open" for a queued run.
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Check the PR is still open
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          skip=false
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            state=$(gh pr view "${{ github.event.pull_request.number }}" \
              --repo "${{ github.repository }}" --json state --jq .state 2>/dev/null \
              || echo closed)
            if [ "$state" != "open" ]; then
              echo "PR no longer open; skipping stale validation run."
              skip=true
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  validate:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: HACS Action Validation
        uses: "hacs/action@main"
        with:
          category: "integration"

      - name: Hassfest Validation
        uses: "home-assistant/actions/hassfest@master"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies with uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv pip install --system aiohttp pytest pytest-homeassistant-custom-component

      - name: Run unit tests
        run: |
          pytest
